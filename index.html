<script>
'use strict';
const LIVE = !!(window.google && google.script && google.script.run);
const DEMO_KEY = 'a-mesa-demo-v1';
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>[...root.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n);
const dates = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira'];
const dateObj=s=>new Date(s+'T12:00:00Z');
const fmtDate=(s,opt)=>new Intl.DateTimeFormat('pt-PT',{timeZone:'Europe/Lisbon',...opt}).format(dateObj(s));
function localDateTime(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(p=>[p.type,p.value]));return {date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute};}
function addDays(s,n){const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function monday(){const d=dateObj(localDateTime().date),day=d.getUTCDay();return addDays(d.toISOString().slice(0,10),day===0?1:day===6?2:1-day);}
function uuid(){return crypto.randomUUID?crypto.randomUUID():[1,1,1,1].map(()=>Math.random().toString(36).slice(2)).join('-');}

function initialDemo(){const start=monday();const meals=[['Frango assado no forno','Com arroz e legumes salteados.',6.5],['Filetes de peixe','Com arroz de tomate e salada.',6.5],['Massa à bolonhesa','Molho de tomate e queijo ralado.',6],['Bacalhau com natas','Gratinado no forno, com salada.',7],['Arroz de legumes','Com grão, cenoura e ervas aromáticas.',6]];return {menu:{version:1,weekStart:start,title:'A ementa desta semana',intro:'Comida caseira, feita com tempo. Escolha os almoços dos seus dias e envie o seu pedido.',notice:'Consulte a cozinha sobre ingredientes e alergénios antes de pedir.',cutoffTime:'10:00',accepting:true,days:meals.map((m,i)=>({date:addDays(start,i),title:m[0],description:m[1],price:m[2],image:plate(i),available:true}))},orders:[]};}
function loadDemo(){try{const d=JSON.parse(sessionStorage.getItem(DEMO_KEY));if(d?.menu?.days?.length===5)return d;}catch{}return initialDemo();}
let demo=loadDemo(),menu,choices={},draft={},token='',view='public',adminPage='menu',requestId=uuid(),sending=false;
const customer={name:'',contact:'',note:''};
let selectedRevision,toastTimer,uploading=0;
function busy(flag){$('#publicTab').disabled=flag;$('#adminTab').disabled=flag;$('#orderForm input,#orderForm textarea').forEach(el=>el.disabled=flag);}
function persistDemo(){try{sessionStorage.setItem(DEMO_KEY,JSON.stringify(demo));}catch{throw new Error('O armazenamento desta demonstração está cheio. Experimente uma fotografia mais pequena.');}}
async function call(method,...args){if(LIVE)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Não foi possível concluir. Tente novamente.')))[method](...args));return demoCall(method,...args);}
async function demoCall(method,...args){switch(method){case'getPublicMenu':return structuredClone(demo.menu);case'adminLogin':return 'demo';case'adminLogout':return true;case'getAdminData':return structuredClone(demo);case'publishMenu':{const next=structuredClone(args[1]);next.version=demo.menu.version+1;demo.menu=next;persistDemo();return structuredClone(next);}case'submitOrder':{const p=args[0];const old=demo.orders.find(o=>o.id===p.id);if(old)return {id:old.id,emailStatus:'demo'};if(p.version!==demo.menu.version)throw new Error('A ementa mudou. Atualize a página antes de enviar.');const o={id:p.id,createdAt:new Date().toISOString(),name:p.name,contact:p.contact,note:p.note,weekStart:menu.weekStart,items:p.items.map(x=>({...x,title:menu.days.find(d=>d.date===x.date).title,price:menu.days.find(d=>d.date===x.date).price})),emailStatus:'demo'};demo.orders.unshift(o);persistDemo();return {id:o.id,emailStatus:'demo'};}default:throw new Error('Operação indisponível.');}}
function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,5000);}
function feedback(el,message,kind='error'){el.textContent=message;el.className='feedback '+kind;el.hidden=false;}
function isClosed(d){if(!menu.accepting||!d.available||!d.title)return true;if(!LIVE)return false;const now=localDateTime();return d.date<now.date||(d.date===now.date&&now.time>=menu.cutoffTime);}
function safeImage(s){return typeof s==='string'&&(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)||(!LIVE&&s.startsWith('data:image/svg+xml;charset=utf-8,')))?s:'';}
function imageHTML(d,i){const src=safeImage(d.image);return src?'<img src="'+esc(src)+'" alt="'+esc(d.title||'Fotografia do prato')+'" loading="lazy">':'<div style="height:100%;display:grid;place-items:center;color:#68735c;font-family:Georgia,serif;font-size:1.3rem">O prato do dia</div>';}
const heroArt='<svg viewBox="0 0 240 220" fill="none" aria-hidden="true"><ellipse cx="120" cy="113" rx="84" ry="85" fill="#e9eddf"/><circle cx="120" cy="108" r="72" fill="#fffef9" stroke="#c9d1bc"/><circle cx="120" cy="108" r="54" stroke="#dfe4d7"/><path d="M104 143q24-52 47-75m-40 57q-24-3-22-22 26-1 28 12m4-8q-5-25 11-31 11 14 0 26m2-5q26 0 27-17-20-6-27 6" fill="#7d9567" stroke="#46623f" stroke-width="1.5"/><path d="M18 53v45m-7-45v25q0 9 7 9t7-9V53m-7 46v65m202-111q-14 23-11 47h11V53v111" stroke="#859276" stroke-width="3" stroke-linecap="round"/></svg>';
function renderPublic(){view='public';$('#publicTab').classList.add('active');$('#adminTab').classList.remove('active');$('#app').innerHTML='<section class="hero"><div><span class="eyebrow">A sua semana começa à mesa</span><h1>O almoço tratado.<br>A semana mais leve.</h1><p>'+esc(menu.intro)+'</p></div><div class="hero-art">'+heroArt+'<span class="stamp">Feito<br>com carinho</span></div></section><section class="week-heading"><div><h2>'+esc(menu.title)+'</h2><p>'+fmtDate(menu.weekStart,{day:'numeric'})+' a '+fmtDate(addDays(menu.weekStart,4),{day:'numeric',month:'long'})+' · Pedidos até às '+esc(menu.cutoffTime)+' do próprio dia</p></div><span class="pill">'+(menu.accepting?'Escolha os seus dias':'Pedidos fechados')+'</span></section><div class="layout"><div class="menu-grid" id="menuGrid"></div><aside class="summary" id="summary" aria-label="O seu pedido"><h2>O seu pedido</h2><p class="summary-intro">Escolha os dias e envie tudo de uma vez.</p><div id="selectedMeals" aria-live="polite"></div><form id="orderForm"><div class="fields"><label>O seu nome<input id="customerName" name="name" autocomplete="name" required minlength="2" maxlength="80" placeholder="Como se chama?" value="'+esc(customer.name)+'"></label><label>Telemóvel ou email<input id="customerContact" name="contact" autocomplete="email" required minlength="6" maxlength="120" placeholder="Para falar consigo sobre o pedido" value="'+esc(customer.contact)+'"></label><label>Observações <span class="micro">(opcional)</span><textarea id="customerNote" name="note" maxlength="400" placeholder="Alguma indicação para a cozinha?">'+esc(customer.note)+'</textarea></label><label class="trap" aria-hidden="true">Empresa<input name="website" tabindex="-1" autocomplete="off"></label><label class="check-label"><input id="consent" type="checkbox" required><span>Autorizo o uso do meu nome e contacto para tratar deste pedido.</span></label></div><button class="primary wide submit" id="submitOrder" type="submit" disabled>'+(LIVE?'Enviar pedido →':'Experimentar pedido →')+'</button><p class="fine">'+(LIVE?'O pedido fica registado para a cozinha. Não é efetuado qualquer pagamento nesta página.':'Apenas uma simulação. Nenhum pedido ou email é enviado.')+'</p><p id="orderFeedback" role="alert" hidden></p></form></aside></div>';
renderCards();renderSelection();$('#orderForm').addEventListener('submit',sendOrder);for(const [id,key]of[['customerName','name'],['customerContact','contact'],['customerNote','note']])$('#'+id).addEventListener('input',e=>{customer[key]=e.target.value;requestId=uuid();});}
function renderCards(){const host=$('#menuGrid');host.innerHTML=menu.days.map((d,i)=>{const c=choices[d.date],closed=isClosed(d);return '<article class="meal '+(c?.want?'selected':'')+'" data-date="'+d.date+'"><div class="photo">'+imageHTML(d,i)+'<span class="day">'+esc(dates[i])+' · '+fmtDate(d.date,{day:'2-digit',month:'2-digit'})+'</span></div><div class="meal-body"><h3>'+esc(d.title||'Ementa por publicar')+'</h3><p class="meal-desc">'+esc(d.description||'')+'</p><div class="price-row"><span class="price">'+(typeof d.price==='number'?money(d.price):'')+'</span><span class="micro">'+(typeof d.price==='number'?'por dose':'')+'</span></div>'+(closed?'<div class="closed">'+(!d.available?'Sem almoço neste dia':'Pedidos indisponíveis')+'</div>':'<div class="choice"><button type="button" class="yes '+(c?.want?'on':'')+'" data-choice="yes" aria-pressed="'+!!c?.want+'">✓ Quero almoço</button><button type="button" class="no '+(c&&c.want===false?'on':'')+'" data-choice="no" aria-pressed="'+!!(c&&c.want===false)+'">Não quero</button></div>'+(c?.want?'<div class="quantity"><span>Quantas doses?</span><div class="stepper"><button type="button" data-qty="-1" aria-label="Diminuir doses de '+esc(dates[i])+'" '+(c.quantity<=1?'disabled':'')+'>−</button><strong>'+c.quantity+'</strong><button type="button" data-qty="1" aria-label="Aumentar doses de '+esc(dates[i])+'" '+(c.quantity>=10?'disabled':'')+'>+</button></div></div>':''))+'</div></article>';}).join('')+'<div class="note-card"><span class="sprig" aria-hidden="true">❧</span><h3>Um dia de cada vez.</h3><p>Escolha «Quero almoço» nos dias que lhe dão jeito. Pode também indicar os dias em que não precisa.</p><p style="margin-top:12px">'+esc(menu.notice)+'</p></div>';
$$('[data-choice]',host).forEach(b=>b.onclick=()=>{if(sending)return;const date=b.closest('[data-date]').dataset.date;choices[date]={want:b.dataset.choice==='yes',quantity:1};requestId=uuid();renderCards();renderSelection();});$$('[data-qty]',host).forEach(b=>b.onclick=()=>{if(sending)return;const date=b.closest('[data-date]').dataset.date;choices[date].quantity=Math.min(10,Math.max(1,choices[date].quantity+Number(b.dataset.qty)));requestId=uuid();renderCards();renderSelection();});}
function selectedItems(){return menu.days.filter(d=>choices[d.date]&&!isClosed(d)).map(d=>({date:d.date,want:choices[d.date].want,quantity:choices[d.date].want?choices[d.date].quantity:0}));}
function renderSelection(){const items=selectedItems(),yes=items.filter(x=>x.want);const host=$('#selectedMeals');if(!items.length)host.innerHTML='<div class="empty" style="margin-bottom:22px">A sua semana ainda está por escolher.<br>Selecione os dias na ementa.</div>';else{let total=0,unknown=false;host.innerHTML='<ul class="selection-list">'+items.map(x=>{const d=menu.days.find(d=>d.date===x.date);if(x.want){if(typeof d.price==='number')total+=d.price*x.quantity;else unknown=true;}return '<li><span>'+esc(fmtDate(d.date,{weekday:'long'}))+'<small>'+esc(x.want?d.title:'Sem almoço')+'</small></span><strong>'+ (x.want?x.quantity+' dose'+(x.quantity>1?'s':''):'—')+'</strong></li>';}).join('')+'</ul><div class="total"><span>'+yes.reduce((n,x)=>n+x.quantity,0)+' doses</span><strong>'+(unknown?'A confirmar':money(total))+'</strong></div>';}
$('#submitOrder').disabled=sending||!items.length;}
async function sendOrder(event){event.preventDefault();if(sending)return;const items=selectedItems();if(!items.length)return;const contact=customer.contact.trim();if(!/^\+?[\d\s().-]{6,24}$/.test(contact)&&!/^\S+@\S+\.\S+$/.test(contact)){feedback($('#orderFeedback'),'Indique um telemóvel ou email válido.');return;}const form=event.currentTarget,payload={id:requestId,version:menu.version,name:customer.name.trim(),contact,note:customer.note.trim(),website:form.elements.website.value,items,consent:true};sending=true;busy(true);$('#submitOrder').disabled=true;$('#submitOrder').textContent='A registar…';try{const result=await call('submitOrder',payload);const host=$('#summary');host.innerHTML='<div class="success-card" role="status"><div class="success-icon">✓</div><h3>'+(LIVE?'Pedido registado.':'Simulação concluída.')+'</h3><p>'+(LIVE?'O seu pedido ficou guardado para a cozinha.':'É assim que a pessoa recebe a confirmação. Pode ver este teste em «A cozinha → Pedidos».')+'</p><p class="order-code">Ref. '+esc(result.id.slice(0,8).toUpperCase())+'</p>'+(result.emailStatus==='pending'?'<p>O aviso por email está pendente. O pedido já está registado e não precisa de o repetir.</p>':'')+'</div><button type="button" class="wide" id="anotherOrder" style="margin-top:18px">Voltar à ementa</button>';$('#anotherOrder').onclick=()=>{choices={};requestId=uuid();renderPublic();};choices={};host.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){feedback($('#orderFeedback'),e.message);$('#submitOrder').textContent=LIVE?'Enviar pedido →':'Experimentar pedido →';$('#submitOrder').disabled=false;}finally{sending=false;busy(false);}}
async function showAdmin(){view='admin';$('#adminTab').classList.add('active');$('#publicTab').classList.remove('active');if(!token){$('#app').innerHTML='<section class="login panel"><span class="eyebrow">A cozinha</span><h2>Olá, chef.</h2><p>'+(LIVE?'Entre para publicar a ementa e acompanhar os pedidos.':'Experimente o painel: altere os pratos, carregue fotografias e consulte os pedidos de teste.')+'</p><form id="loginForm">'+(LIVE?'<label>Palavra-passe da cozinha<input type="password" id="adminPassword" required autocomplete="current-password"></label>':'')+'<button class="primary wide" type="submit">'+(LIVE?'Entrar':'Experimentar o painel →')+'</button><p id="loginFeedback" role="alert" hidden></p></form></section>';$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('button',e.currentTarget);b.disabled=true;try{token=await call('adminLogin',LIVE?$('#adminPassword').value:'');await renderAdmin();}catch(err){feedback($('#loginFeedback'),err.message);b.disabled=false;}};return;}await renderAdmin();}
async function renderAdmin(){try{const data=await call('getAdminData',token);draft=structuredClone(data.menu);selectedRevision=draft.version;$('#app').innerHTML='<div class="editor-head"><div><span class="eyebrow">A cozinha</span><h2>A semana, organizada.</h2><p>Publique os almoços e acompanhe os pedidos.</p></div><button id="logout" type="button">Sair</button></div><div class="editor-tabs"><button type="button" id="editMenu" class="'+(adminPage==='menu'?'active':'')+'">Ementa</button><button type="button" id="seeOrders" class="'+(adminPage==='orders'?'active':'')+'">Pedidos</button></div><div id="adminContent"></div>';$('#logout').onclick=async()=>{await call('adminLogout',token);token='';renderPublic();};$('#editMenu').onclick=()=>{adminPage='menu';renderAdmin();};$('#seeOrders').onclick=()=>{adminPage='orders';renderAdmin();};if(adminPage==='menu')renderEditor();else renderOrders(data.orders);}catch(e){token='';await showAdmin();const f=$('#loginFeedback');if(f)feedback(f,e.message);}}
function renderEditor(){$('#adminContent').innerHTML='<form id="menuForm"><section class="panel settings-grid"><label>Título da ementa<input name="title" maxlength="70" required value="'+esc(draft.title)+'"></label><label>Semana de segunda-feira<input type="date" name="weekStart" required value="'+draft.weekStart+'"></label><label>Hora limite dos pedidos<input type="time" name="cutoffTime" required value="'+draft.cutoffTime+'"></label><label class="full">Texto de apresentação<textarea name="intro" maxlength="240">'+esc(draft.intro)+'</textarea></label><label class="full">Informação para os clientes<textarea name="notice" maxlength="300">'+esc(draft.notice)+'</textarea></label><label class="check-label full"><input type="checkbox" name="accepting" '+(draft.accepting?'checked':'')+'>Aceitar pedidos para esta ementa</label></section><div id="editDays">'+draft.days.map((d,i)=>'<section class="edit-day" data-index="'+i+'"><div class="edit-image"><div id="editorImage'+i+'">'+imageHTML(d,i)+'</div><label class="upload-label">Escolher fotografia<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="'+i+'" aria-label="Fotografia de '+dates[i]+'"></label></div><div><h3>'+dates[i]+' <span class="micro editDate">'+fmtDate(d.date,{day:'2-digit',month:'2-digit'})+'</span></h3><div class="edit-grid"><label>Prato<input data-field="title" maxlength="100" value="'+esc(d.title)+'"></label><label>Preço (€)<input data-field="price" type="number" min="0" max="500" step="0.01" value="'+(typeof d.price==='number'?d.price:'')+'"></label><label class="full">Descrição<input data-field="description" maxlength="220" value="'+esc(d.description)+'"></label><label class="check-label full"><input data-field="available" type="checkbox" '+(d.available?'checked':'')+'>Há almoço neste dia</label></div></div></section>').join('')+'</div><p id="publishFeedback" role="alert" hidden></p><div class="admin-actions"><p>'+(LIVE?'As alterações ficam visíveis para todos após publicar.':'Na demonstração, as alterações ficam apenas neste dispositivo.')+'</p><button class="primary" id="publishButton" type="submit">Publicar ementa →</button></div></form>';
$('#menuForm').onsubmit=publish;$$('[data-upload]').forEach(input=>input.onchange=async()=>{const file=input.files[0];if(!file)return;const b=$('#publishButton');uploading++;b.disabled=true;try{draft.days[Number(input.dataset.upload)].image=await compressPhoto(file);$('#editorImage'+input.dataset.upload).innerHTML=imageHTML(draft.days[Number(input.dataset.upload)],Number(input.dataset.upload));notify('Fotografia pronta. Publique a ementa para guardar.');}catch(e){feedback($('#publishFeedback'),e.message);}finally{uploading--;b.disabled=uploading>0;}});$('#menuForm').elements.weekStart.onchange=e=>{if(!e.target.value)return;$$('.editDate').forEach((el,i)=>el.textContent=fmtDate(addDays(e.target.value,i),{day:'2-digit',month:'2-digit'}));};}
async function compressPhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Escolha uma fotografia JPG, PNG ou WebP.');if(file.size>15*1024*1024)throw new Error('A fotografia deve ter menos de 15 MB.');const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Não foi possível ler a fotografia.'));i.src=url;});const canvas=document.createElement('canvas');let ratio=Math.min(1,800/Math.max(img.width,img.height));canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let quality=.8,data=canvas.toDataURL('image/jpeg',quality);while(data.length>180000&&quality>.3){quality-=.1;data=canvas.toDataURL('image/jpeg',quality);}if(data.length>180000)throw new Error('Esta imagem ainda é demasiado grande. Escolha outra fotografia.');return data;}finally{URL.revokeObjectURL(url);}}
async function publish(event){event.preventDefault();if(uploading)return;const form=event.currentTarget,start=form.elements.weekStart.value;if(dateObj(start).getUTCDay()!==1){feedback($('#publishFeedback'),'Escolha uma segunda-feira para o início da semana.');return;}const next={version:selectedRevision,weekStart:start,title:form.elements.title.value.trim(),intro:form.elements.intro.value.trim(),notice:form.elements.notice.value.trim(),cutoffTime:form.elements.cutoffTime.value,accepting:form.elements.accepting.checked,days:$$('.edit-day').map((el,i)=>{const price=$('[data-field="price"]',el).value;return {date:addDays(start,i),title:$('[data-field="title"]',el).value.trim(),description:$('[data-field="description"]',el).value.trim(),price:price===''?null:Number(price),available:$('[data-field="available"]',el).checked,image:draft.days[i].image||''};})};if(next.days.some(d=>d.available&&!d.title)){feedback($('#publishFeedback'),'Escreva o prato dos dias disponíveis ou retire a opção «Há almoço neste dia».');return;}const b=$('#publishButton');b.disabled=true;b.textContent='A publicar…';try{menu=await call('publishMenu',token,next);choices={};requestId=uuid();notify(LIVE?'Ementa publicada.':'Ementa de demonstração atualizada.');renderPublic();window.scrollTo({top:0,behavior:'smooth'});}catch(e){feedback($('#publishFeedback'),e.message);b.disabled=false;b.textContent='Publicar ementa →';}}
function renderOrders(orders){const current=orders.filter(o=>o.weekStart===draft.weekStart);$('#adminContent').innerHTML='<p class="fine" style="margin-bottom:18px">Semana de '+fmtDate(draft.weekStart,{day:'numeric',month:'long'})+' · '+current.length+' respostas'+(!LIVE?' de teste':'')+'</p><div class="stat-grid">'+draft.days.map((d,i)=>'<div class="stat"><span>'+dates[i].split('-')[0]+'</span><strong>'+current.reduce((n,o)=>n+o.items.filter(x=>x.date===d.date&&x.want).reduce((s,x)=>s+x.quantity,0),0)+'</strong><small>doses pedidas</small></div>').join('')+'</div><div class="panel">'+(current.length?current.map(o=>'<article class="order"><div class="order-top"><strong>'+esc(o.name)+'</strong><span class="micro">'+new Date(o.createdAt).toLocaleString('pt-PT',{timeZone:'Europe/Lisbon',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span></div><p>'+esc(o.contact)+' · Ref. '+esc(o.id.slice(0,8).toUpperCase())+'</p><ul>'+o.items.map(x=>'<li>'+esc(fmtDate(x.date,{weekday:'long'}))+': '+(x.want?x.quantity+' × '+esc(x.title):'não quer almoço')+'</li>').join('')+'</ul>'+(o.note?'<p>Observação: '+esc(o.note)+'</p>':'')+'<p class="micro">'+(o.emailStatus==='demo'?'Demonstração — nenhum email enviado':o.emailStatus==='sent'?'Aviso por email enviado':'Aviso por email pendente; o pedido está guardado')+'</p></article>').join(''):'<div class="empty">Ainda não há pedidos para esta semana.</div>')+'</div><div class="admin-actions"><span class="fine">Os pedidos conservam o prato e o preço escolhidos no momento do envio.</span><button id="refreshOrders" type="button">Atualizar pedidos</button></div>';$('#refreshOrders').onclick=()=>renderAdmin();}
$('#publicTab').onclick=async()=>{try{const next=await call('getPublicMenu');if(next.version!==menu.version){choices={};requestId=uuid();}menu=next;renderPublic();}catch(e){notify(e.message);}};$('#brandLink').onclick=e=>{e.preventDefault();$('#publicTab').click();};$('#adminTab').onclick=showAdmin;
async function init(){$('#demoBanner').hidden=LIVE;$('#footerMode').textContent=LIVE?'Feito para simplificar a semana.':'Prévia · dados apenas neste dispositivo';try{menu=await call('getPublicMenu');renderPublic();}catch(e){$('#app').innerHTML='<div class="login panel"><h2>Já voltamos à mesa.</h2><p>'+esc(e.message)+'</p><button type="button" id="retry">Tentar novamente</button></div>';$('#retry').onclick=init;}}
init();
</script>
</body>
