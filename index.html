.portions{display:grid;grid-template-columns:minmax(0,1fr) 78px;align-items:center;gap:12px;margin-top:14px}
.portions input{margin:0;width:100%;text-align:center}

@media(max-width:520px){.portions input,.password-field input{font-size:16px}.password-field{gap:6px}}

.stat-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.day-stat{padding:16px 14px}
.day-stat .stat-day{font-family:inherit;font-size:.91rem;font-weight:700;margin:0;color:var(--ink)}

.day-counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:end;gap:10px}
.stat-count{text-align:center;min-width:0}
.stat-count+.stat-count{border-left:1px solid var(--line);padding-left:10px}
.day-stat .stat-number{font-family:inherit;font-size:2.5rem;line-height:1;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:0 0 10px}
.day-stat .stat-number-compact{font-size:1.7rem}

.day-stat .stat-label{display:block;font-size:.73rem;font-weight:700;line-height:1.3}
.day-stat .count-lunch .stat-number,.day-stat .count-lunch .stat-label{color:#23614b}
.day-stat .count-dessert .stat-number,.day-stat .count-dessert .stat-label{color:#7b3fa0}
.dessert-breakdown .fine{font-size:.84rem;line-height:1.65}

<script>
'use strict';

const LIVE = /^https:\/\//.test(API_URL);
const DEMO_KEY = 'a-mesa-demo-v4';
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>[...root.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dates = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira'];
const dateObj=s=>new Date(s+'T12:00:00Z');
const fmtDate=(s,opt)=>new Intl.DateTimeFormat('pt-PT',{timeZone:'Europe/Lisbon',...opt}).format(dateObj(s));
function localDateTime(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(p=>[p.type,p.value]));return {date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute};}
function addDays(s,n){const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function monday(){const d=dateObj(localDateTime().date),day=d.getUTCDay();return addDays(d.toISOString().slice(0,10),day===0?1:day===6?2:1-day);}
function uuid(){return crypto.randomUUID?crypto.randomUUID():[1,1,1,1].map(()=>Math.random().toString(36).slice(2)).join('-');}
function plate(kind=0){const colors=[['#d9e2cd','#d4a058','#789347'],['#e9d9ca','#bc7346','#7b9450'],['#e7ddc4','#ce7751','#7c9550'],['#d8dfd3','#e3bc71','#799458'],['#dfe2cc','#b88d4b','#c36c47']][kind%5];const svg='<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="'+colors[0]+'"/><path d="M0 40H640M0 120H640M0 200H640M0 280H640" stroke="#fff" opacity=".14" stroke-width="1"/><ellipse cx="325" cy="195" rx="141" ry="137" fill="#1d2814" opacity=".08"/><circle cx="320" cy="176" r="137" fill="#f9f7ed"/><circle cx="320" cy="176" r="112" fill="none" stroke="#e2dfd2" stroke-width="2"/><path d="M258 109q-28 15-31 62t38 47q47 8 61-22t-13-56q-26-34-55-31" fill="'+colors[1]+'"/><path d="M245 145l62 26m-66-9 67 28m-58-9 49 20" stroke="#7a4b2c" stroke-width="5" opacity=".32"/><g fill="'+colors[2]+'"><circle cx="371" cy="122" r="23"/><circle cx="393" cy="151" r="23"/><circle cx="359" cy="156" r="24"/><circle cx="380" cy="179" r="21"/></g><g fill="#e6cb8b"><ellipse cx="335" cy="231" rx="23" ry="14" transform="rotate(-20 335 231)"/><ellipse cx="367" cy="219" rx="20" ry="15" transform="rotate(-40 367 219)"/><ellipse cx="340" cy="206" rx="19" ry="13" transform="rotate(20 340 206)"/></g><g fill="#638047"><ellipse cx="295" cy="117" rx="12" ry="5" transform="rotate(-35 295 117)"/><ellipse cx="311" cy="110" rx="12" ry="5" transform="rotate(25 311 110)"/></g><path d="M118 66v91m-9-91v35q0 14 9 14t9-14V66m-9 91v121m407-210q-20 35-14 85h14V68v210" stroke="#737c68" stroke-width="5" fill="none" stroke-linecap="round"/><text x="320" y="338" text-anchor="middle" fill="#5b674f" font-family="sans-serif" font-size="12" letter-spacing="2">EMENTA DE EXEMPLO</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}

function sha256Text(text) {
  const bytes = [];
  for (const ch of unescape(encodeURIComponent(String(text)))) bytes.push(ch.charCodeAt(0));
  const bitLength=bytes.length*8;
  bytes.push(128); while(bytes.length%64!==56)bytes.push(0);
  const high=Math.floor(bitLength/4294967296),low=bitLength>>>0;
  for(let s=24;s>=0;s-=8)bytes.push((high>>>s)&255);

function cleanText(value,max,required=false){

const MAX_QUANTITY=99;
function requestClosed(day,menu,now,allowPast=false){

function makeOrder(input,menu,now,allowPast=false){
 if(!input||input.website||input.consent!==true)throw Error('Confirme a utilização do nome para tratar do pedido.');
 if(input.schemaVersion!==4)throw Error('Atualize a página para usar a nova versão dos pedidos.');
 if(typeof input.id!=='string'||!/^[A-Za-z0-9-]{20,80}$/.test(input.id))throw Error('Referência inválida.');
 if(input.version!==menu.version)throw Error('A ementa mudou. Atualize a página antes de enviar.');
 if(!menu.accepting)throw Error('Os pedidos estão fechados.');
 const name=cleanText(input.name,80,true);if(name.length<2)throw Error('Indique o seu nome.');

 if(!Array.isArray(input.items)||!input.items.length||input.items.length>5)throw Error('Escolha pelo menos um dia.');
 const seen=new Set();
 const items=input.items.map(x=>{
  if(!x||seen.has(x.date)||typeof x.want!=='boolean')throw Error('Escolha de dia inválida.');seen.add(x.date);
  const day=menu.days.find(d=>d.date===x.date);if(!day)throw Error('Dia inválido.');
  if(requestClosed(day,menu,now,allowPast))throw Error('Já passou a hora limite para um dos dias.');
  if(x.want&&(!day.available||!day.title))throw Error('O almoço de um dos dias já não está disponível.');
  if(!Number.isInteger(x.quantity)||(x.want?(x.quantity<1||x.quantity>MAX_QUANTITY):x.quantity!==0))throw Error('Quantidade de almoços inválida.');
  const dessertId=x.dessertId??'',dq=x.dessertQuantity??0;
  if(typeof dessertId!=='string'||!Number.isInteger(dq)||dq<0||dq>MAX_QUANTITY)throw Error('Quantidade de sobremesas inválida.');
  if(!dessertId&&dq!==0)throw Error('Escolha a sobremesa para as doses indicadas.');
  let dessert=null;
  if(dessertId){
   const d=menu.desserts.find(d=>d.id===dessertId&&d.available);
   if(!d||!d.title||dq<1)throw Error('Escolha uma sobremesa disponível e indique as doses.');
   dessert={id:d.id,title:d.title,quantity:dq,...validateAllergens(d)};
  }
  return {date:day.date,title:day.title,want:x.want,quantity:x.quantity,...validateAllergens(day),dessert};
 });
 return {schemaVersion:4,id:input.id,version:menu.version,weekStart:menu.weekStart,name,note,items};
}

   (available.length?'<label>Qual sobremesa?<select data-dessert aria-label="Sobremesa de '+esc(dates[i])+'"><option value="">Sem sobremesa</option>'+available.map(d=>'<option value="'+d.id+'" '+(d.id===c.dessertId?'selected':'')+'>'+esc(d.title)+'</option>').join('')+'</select></label>'+
   (chosen?'<label class="portions">Doses de sobremesa<input type="number" inputmode="numeric" min="1" max="'+MAX_QUANTITY+'" step="1" data-dessert-qty aria-label="Doses de sobremesa de '+esc(dates[i])+'" value="'+(Number.isFinite(c.dessertQuantity)?c.dessertQuantity:'')+'"></label>'+allergenInfo(chosen):'')+
   '<p class="fine dessert-hint">Pode pedir só sobremesa.</p>':'<p class="fine">Sem sobremesas disponíveis esta semana.</p>')+'</section>';
 }
 return '<article class="meal '+(c.want===true||c.dessertId?'selected':'')+'" data-date="'+day.date+'"><div class="photo">'+imageHTML(day,i)+'<span class="day">'+esc(dates[i])+' · '+fmtDate(day.date,{day:'2-digit',month:'2-digit'})+'</span></div>'+
 '<div class="meal-body"><h3>'+esc(hasLunch?day.title:'Sem almoço neste dia')+'</h3><p class="meal-desc">'+esc(day.description||'')+'</p>'+(hasLunch?allergenInfo(day):'')+controls+'</div></article>';
}
function renderCards(){
 const host=$('#menuGrid');if(!host)return;
 host.innerHTML=menu.days.map(mealCard).join('')+
 '<div class="note-card"><span class="sprig" aria-hidden="true">❧</span><h3>À medida da sua semana.</h3><p>Escolha almoço, sobremesa ou ambos. As doses de sobremesa são independentes das doses de almoço.</p><p style="margin-top:12px">'+esc(menu.notice)+'</p></div>';
 $$('[data-choice]',host).forEach(button=>button.onclick=()=>{
  if(sending)return;const c=choiceFor(button.closest('[data-date]').dataset.date);
  c.want=button.dataset.choice==='yes';if(c.want&&!validQuantity(c.quantity))c.quantity=1;
  requestId=uuid();renderCards();renderSelection();
 });
 $$('[data-dessert]',host).forEach(select=>select.onchange=()=>{
  if(sending)return;const c=choiceFor(select.closest('[data-date]').dataset.date);
  c.dessertId=select.value;c.dessertQuantity=c.dessertId?(validQuantity(c.dessertQuantity)?c.dessertQuantity:1):0;
  requestId=uuid();renderCards();renderSelection();
 });
 for(const [selector,key] of [['[data-lunch-qty]','quantity'],['[data-dessert-qty]','dessertQuantity']])
  $$(selector,host).forEach(input=>input.oninput=()=>{
   if(sending)return;choiceFor(input.closest('[data-date]').dataset.date)[key]=input.value===''?NaN:Number(input.value);
   requestId=uuid();renderSelection();
  });
}
function renderSelection(){
 const host=$('#selectedMeals');if(!host)return;const items=selectedItems();
 host.innerHTML=items.length?'<ul class="selection-list">'+items.map(x=>{
  const day=menu.days.find(d=>d.date===x.date),dessert=menu.desserts.find(d=>d.id===x.dessertId);
  return '<li><span><strong>'+esc(fmtDate(x.date,{weekday:'long'}))+'</strong><small>'+(x.want?quantityText(x.quantity)+' × '+esc(day.title):'Sem almoço')+'</small>'+
   (dessert?'<small class="dessert-summary">'+quantityText(x.dessertQuantity)+' × '+esc(dessert.title)+'</small>':'<small>Sem sobremesa</small>')+'</span></li>';
 }).join('')+'</ul>':'<div class="empty" style="margin-bottom:22px">Escolha almoço, sobremesa ou ambos nos dias pretendidos.</div>';
 const button=$('#submitOrder');if(button)button.disabled=sending||!items.length;
}
async function sendOrder(event){
 event.preventDefault();if(sending)return;const form=event.currentTarget;
 const payload={schemaVersion:4,id:requestId,version:menu.version,name:$('#customerName').value.trim(),note:$('#customerNote').value.trim(),website:form.elements.website.value,consent:$('#consent').checked,items:selectedItems()};
 try{makeOrder(payload,menu,localDateTime(),!LIVE);}catch(e){feedback($('#orderFeedback'),e.message);return;}
 sending=true;setBusy(true);$('#submitOrder').disabled=true;$('#submitOrder').textContent='A registar…';
 try{
  const result=await call('submitOrder',payload);
  $('#summary').innerHTML='<div class="success-card" role="status"><div class="success-icon">✓</div><h3>'+(LIVE?'Pedido guardado.':'Simulação guardada.')+'</h3><p>'+
   (LIVE?'As suas escolhas estão disponíveis no painel da cozinha.':'Veja o teste em A cozinha → Pedidos.')+'</p><p class="order-code">Ref. '+esc(result.id.slice(0,8).toUpperCase())+'</p></div>'+
   '<button class="wide" id="anotherOrder" type="button" style="margin-top:18px">Voltar à ementa</button>';
  choices={};requestId=uuid();$('#anotherOrder').onclick=renderPublic;$('#summary').scrollIntoView({behavior:'smooth',block:'center'});
 }catch(e){feedback($('#orderFeedback'),e.message);$('#submitOrder').textContent=LIVE?'Enviar pedido →':'Experimentar pedido →';}
 finally{sending=false;setBusy(false);renderCards();renderSelection();}
}
function togglePassword(input,button){
 const visible=input.type==='password';input.type=visible?'text':'password';
 button.textContent=visible?'Ocultar':'Mostrar';button.setAttribute('aria-pressed',String(visible));
 button.setAttribute('aria-label',visible?'Ocultar código':'Mostrar código');
}
async function showAdmin(){
 view='admin';$('#adminTab').classList.add('active');$('#publicTab').classList.remove('active');
 if(token){await renderAdmin();return;}
 $('#app').innerHTML='<section class="login panel"><span class="eyebrow">A cozinha</span><h2>Entrada reservada.</h2><p>Introduza o código para gerir a ementa e os pedidos.</p>'+
  '<form id="loginForm"><label for="adminPassword">Código da cozinha</label><div class="password-field"><input id="adminPassword" type="password" required maxlength="200" autocomplete="current-password">'+
  '<button id="togglePassword" type="button" aria-controls="adminPassword" aria-pressed="false" aria-label="Mostrar código">Mostrar</button></div><button class="primary wide" type="submit">Entrar →</button><p id="loginFeedback" role="alert" hidden></p></form>'+
  (!LIVE?'<p class="fine">Prévia local: o código permite testar o painel. A proteção dos dados partilhados depende da ligação ao servidor.</p>':'')+'</section>';
 $('#togglePassword').onclick=()=>togglePassword($('#adminPassword'),$('#togglePassword'));
 $('#loginForm').onsubmit=async event=>{
  event.preventDefault();const button=$('[type="submit"]',event.currentTarget);button.disabled=true;
  try{token=await call('adminLogin',$('#adminPassword').value);await renderAdmin();}
  catch(e){const f=$('#loginFeedback');if(f)feedback(f,e.message);button.disabled=false;}
 };
}
async function renderAdmin(){
 try{
  const data=await call('getAdminData',token);draft=menuFromServer(data.menu);selectedRevision=draft.version;
  $('#app').innerHTML='<div class="editor-head"><div><span class="eyebrow">A cozinha</span><h2>A semana, organizada.</h2><p>Publique a ementa e acompanhe as doses pedidas.</p></div><button id="logout" type="button">Sair</button></div>'+
   '<div class="editor-tabs"><button type="button" id="editMenu" class="'+(adminPage==='menu'?'active':'')+'">Ementa</button><button type="button" id="seeOrders" class="'+(adminPage==='orders'?'active':'')+'">Pedidos</button></div><div id="adminContent"></div>';
  $('#logout').onclick=async()=>{try{await call('adminLogout',token);}catch(e){notify(e.message);}finally{token='';menu=structuredClone(draft);renderPublic();}};
  $('#editMenu').onclick=()=>{adminPage='menu';renderAdmin();};$('#seeOrders').onclick=()=>{adminPage='orders';renderAdmin();};
  if(adminPage==='menu')renderEditor();else renderOrders(data.orders);
 }catch(e){token='';await showAdmin();feedback($('#loginFeedback'),e.message);}
}
function renderEditor(){
 $('#adminContent').innerHTML='<form id="menuForm"><section class="panel settings-grid"><label>Título da ementa<input name="title" maxlength="70" required value="'+esc(draft.title)+'"></label>'+
  '<label>Semana de segunda-feira<input type="date" name="weekStart" required value="'+draft.weekStart+'"></label><label>Hora limite dos pedidos<input type="time" name="cutoffTime" required value="'+draft.cutoffTime+'"></label>'+
  '<label class="full">Texto de apresentação<textarea name="intro" maxlength="240">'+esc(draft.intro)+'</textarea></label><label class="full">Informação para os colegas<textarea name="notice" maxlength="300">'+esc(draft.notice)+'</textarea></label>'+
  '<label class="check-label full"><input type="checkbox" name="accepting" '+(draft.accepting?'checked':'')+'>Aceitar pedidos de almoço e sobremesa</label></section>'+
  '<div id="editDays">'+draft.days.map((d,i)=>'<section class="edit-day" data-index="'+i+'"><div class="edit-image"><div id="editorImage'+i+'">'+imageHTML(d,i)+'</div><label class="upload-label">Escolher fotografia<input type="file" accept="image/jpeg,image/png,image/webp" data-upload="'+i+'" aria-label="Fotografia de '+dates[i]+'"></label></div>'+
   '<div><h3>'+dates[i]+' <span class="micro editDate">'+fmtDate(d.date,{day:'2-digit',month:'2-digit'})+'</span></h3><div class="edit-grid organiser-grid"><label class="full">Prato<input data-field="title" maxlength="100" value="'+esc(d.title)+'"></label>'+
   '<label class="full">Descrição<input data-field="description" maxlength="220" value="'+esc(d.description)+'"></label><label class="check-label full"><input data-field="available" type="checkbox" '+(d.available?'checked':'')+'>Há almoço neste dia</label><div class="full">'+allergenEditor(d)+'</div></div></div></section>').join('')+'</div>'+
  '<section class="panel"><h2 style="font-size:1.7rem">Sobremesas da semana</h2><p class="fine" style="margin-bottom:18px">As sobremesas podem ser pedidas em qualquer dia da semana, mesmo sem almoço.</p><div class="dessert-editors">'+draft.desserts.map((d,i)=>
   '<section class="dessert-editor" data-dessert-index="'+i+'"><h3>Opção '+(i+1)+'</h3><div class="edit-grid organiser-grid"><label class="full">Nome da sobremesa<input data-dessert-name maxlength="80" value="'+esc(d.title)+'"></label>'+
   '<label class="check-label full"><input type="checkbox" data-dessert-available '+(d.available?'checked':'')+'>Disponível esta semana</label><div class="full">'+allergenEditor(d)+'</div></div></section>').join('')+'</div></section>'+
  '<p id="publishFeedback" role="alert" hidden></p><div class="admin-actions"><p>'+(LIVE?'As alterações ficam visíveis para todos após publicar.':'As alterações de demonstração ficam nesta sessão do navegador.')+'</p><button class="primary" id="publishButton" type="submit">Publicar ementa →</button></div></form>';
 $('#menuForm').onsubmit=publish;
 $$('[data-upload]').forEach(input=>input.onchange=async()=>{
  const file=input.files[0];if(!file)return;const button=$('#publishButton');uploading++;button.disabled=true;
  try{draft.days[Number(input.dataset.upload)].image=await compressPhoto(file);$('#editorImage'+input.dataset.upload).innerHTML=imageHTML(draft.days[Number(input.dataset.upload)],Number(input.dataset.upload));notify('Fotografia pronta. Publique a ementa para guardar.');}
  catch(e){feedback($('#publishFeedback'),e.message);}
  finally{uploading--;button.disabled=uploading>0;}
 });
 $('#menuForm').elements.weekStart.onchange=e=>{if(!validDate(e.target.value))return;$$('.editDate').forEach((el,i)=>el.textContent=fmtDate(addDays(e.target.value,i),{day:'2-digit',month:'2-digit'}));};
}
async function publish(event){
 event.preventDefault();if(uploading)return;const form=event.currentTarget,start=form.elements.weekStart.value;
 const input={schemaVersion:4,version:selectedRevision,weekStart:start,title:form.elements.title.value.trim(),intro:form.elements.intro.value.trim(),notice:form.elements.notice.value.trim(),cutoffTime:form.elements.cutoffTime.value,accepting:form.elements.accepting.checked,
  days:$$('.edit-day').map((el,i)=>({date:addDays(start,i),title:$('[data-field="title"]',el).value.trim(),description:$('[data-field="description"]',el).value.trim(),available:$('[data-field="available"]',el).checked,image:draft.days[i].image||'',...collectAllergens(el)})),
  desserts:$$('.dessert-editor').map((el,i)=>({id:['dessert-a','dessert-b'][i],title:$('[data-dessert-name]',el).value.trim(),available:$('[data-dessert-available]',el).checked,...collectAllergens(el)}))};
 let next;try{next=validateMenu(input,!LIVE);}catch(e){feedback($('#publishFeedback'),e.message);return;}
 const button=$('#publishButton');button.disabled=true;button.textContent='A publicar…';
 try{menu=menuFromServer(await call('publishMenu',token,next));choices={};requestId=uuid();notify(LIVE?'Ementa e sobremesas publicadas.':'Demonstração atualizada.');renderPublic();window.scrollTo({top:0,behavior:'smooth'});}
 catch(e){feedback($('#publishFeedback'),e.message);button.disabled=false;button.textContent='Publicar ementa →';}
}
function dailyCounts(rows,days){
 const counts=new Map(days.map(day=>[day.date,{date:day.date,lunches:0,desserts:0,types:new Map()}]));
 for(const order of rows)for(const item of order.items||[]){
  const day=counts.get(item.date);if(!day)continue;
  if(item.want&&Number.isSafeInteger(item.quantity)&&item.quantity>0)day.lunches+=item.quantity;
  const dessert=item.dessert;
  if(dessert&&Number.isSafeInteger(dessert.quantity)&&dessert.quantity>0){
   day.desserts+=dessert.quantity;
   day.types.set(dessert.title,(day.types.get(dessert.title)||0)+dessert.quantity);
  }
 }
 return [...counts.values()];
}
function countMarkup(number,label,kind){
 const size=number>=10000?' stat-number-small':number>=1000?' stat-number-compact':'';
 return '<div class="stat-count count-'+kind+'"><strong class="stat-number'+size+'">'+number+'</strong><span class="stat-label">'+label+'</span></div>';
}
function renderOrders(orders){
 const rows=orders.filter(o=>o.weekStart===draft.weekStart).map(orderView),totals=dailyCounts(rows,draft.days);
 $('#adminContent').innerHTML='<p class="fine" style="margin-bottom:18px">Semana de '+fmtDate(draft.weekStart,{day:'numeric',month:'long'})+' · '+rows.length+' respostas'+(!LIVE?' de teste':'')+'</p>'+
  '<div class="stat-grid">'+totals.map((day,i)=>
   '<section class="stat day-stat" aria-labelledby="count-day-'+i+'"><h3 id="count-day-'+i+'" class="stat-day">'+esc(dates[i].split('-')[0])+'</h3><p class="stat-date">'+fmtDate(day.date,{day:'2-digit',month:'2-digit'})+'</p>'+
   '<div class="day-counts">'+countMarkup(day.lunches,'Almoços','lunch')+countMarkup(day.desserts,'Sobremesas','dessert')+'</div></section>'
  ).join('')+'</div>'+
  '<div class="panel dessert-breakdown"><h3>Sobremesas por preparar</h3>'+totals.map(day=>
   '<p class="fine"><strong>'+esc(fmtDate(day.date,{weekday:'long'}))+'</strong> · '+
   (day.types.size?[...day.types].map(([name,n])=>'<strong class="dessert-dose">'+n+'</strong> × '+esc(name)).join(' · '):'Sem sobremesas pedidas')+'</p>'
  ).join('')+'</div>'+
  '<div class="panel">'+(rows.length?rows.map(o=>'<article class="order" data-order="'+esc(o.id)+'"><div class="order-top"><strong>'+esc(o.name)+'</strong><span class="micro">'+new Date(o.createdAt).toLocaleString('pt-PT',{timeZone:'Europe/Lisbon',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span></div>'+
   '<p>Ref. '+esc(o.id.slice(0,8).toUpperCase())+'</p><ul>'+o.items.map(x=>'<li>'+esc(fmtDate(x.date,{weekday:'long'}))+': '+(x.want?x.quantity+' × '+esc(x.title):'sem almoço')+
   (x.dessert?'<br><strong>Sobremesa: '+x.dessert.quantity+' × '+esc(x.dessert.title)+'</strong>':' · sem sobremesa')+'</li>').join('')+'</ul>'+
   (o.note?'<p><strong>Observações:</strong> '+esc(o.note)+'</p>':'')+'</article>').join(''):'<div class="empty">Ainda não há pedidos para esta semana.</div>')+
  '</div><div class="admin-actions"><p class="fine">Todos os pedidos ficam neste painel. As sobremesas incluem os pedidos sem almoço.</p><button type="button" id="refreshOrders">Atualizar pedidos</button></div>';
 $('#refreshOrders').onclick=renderAdmin;
}
async function refreshPublic(){
 try{const next=menuFromServer(await call('getPublicMenu'));if(!menu||next.version!==menu.version){choices={};requestId=uuid();}menu=next;renderPublic();}
 catch(e){notify(e.message);}
}
async function init(){
 $('#demoBanner').hidden=LIVE;$('#footerMode').textContent=LIVE?'A semana da equipa, organizada.':'Prévia · dados apenas nesta sessão';
 if(!LIVE)$('#demoBanner').innerHTML='<strong>Demonstração</strong> · Dados apenas nesta sessão do navegador. Consulte os testes em A cozinha → Pedidos.';
 try{menu=menuFromServer(await call('getPublicMenu'));renderPublic();}
 catch(e){$('#app').innerHTML='<div class="login panel"><h2>Já voltamos à mesa.</h2><p>'+esc(e.message)+'</p><button id="retry" type="button">Tentar novamente</button></div>';$('#retry').onclick=init;}
}
$('#adminTab').onclick=()=>showAdmin();$('#publicTab').onclick=refreshPublic;
$('#brandLink').onclick=e=>{e.preventDefault();if(!sending)refreshPublic();};
init();

</script>
