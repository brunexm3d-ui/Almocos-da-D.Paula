<script>
'use strict';
// URL HTTPS do servidor, depois de o ativar. Vazio mantém a demonstração local.
const API_URL = '';
const LIVE = /^https:\/\//.test(API_URL);
const DEMO_KEY = 'a-mesa-demo-v2';
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>[...root.querySelectorAll(s)];
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n);
const dates = ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira'];
const dateObj=s=>new Date(s+'T12:00:00Z');
const fmtDate=(s,opt)=>new Intl.DateTimeFormat('pt-PT',{timeZone:'Europe/Lisbon',...opt}).format(dateObj(s));
function localDateTime(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Lisbon',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(p=>[p.type,p.value]));return {date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute};}
function addDays(s,n){const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function monday(){const d=dateObj(localDateTime().date),day=d.getUTCDay();return addDays(d.toISOString().slice(0,10),day===0?1:day===6?2:1-day);}
function uuid(){return crypto.randomUUID?crypto.randomUUID():[1,1,1,1].map(()=>Math.random().toString(36).slice(2)).join('-');}
function plate(kind=0){const colors=[['#d9e2cd','#d4a058','#789347'],['#e9d9ca','#bc7346','#7b9450'],['#e7ddc4','#ce7751','#7c9550'],['#d8dfd3','#e3bc71','#799458'],['#dfe2cc','#b88d4b','#c36c47']][kind%5];const svg='<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><rect width="640" height="360" fill="'+colors[0]+'"/><path d="M0 40H640M0 120H640M0 200H640M0 280H640" stroke="#fff" opacity=".14" stroke-width="1"/><ellipse cx="325" cy="195" rx="141" ry="137" fill="#1d2814" opacity=".08"/><circle cx="320" cy="176" r="137" fill="#f9f7ed"/><circle cx="320" cy="176" r="112" fill="none" stroke="#e2dfd2" stroke-width="2"/><path d="M258 109q-28 15-31 62t38 47q47 8 61-22t-13-56q-26-34-55-31" fill="'+colors[1]+'"/><path d="M245 145l62 26m-66-9 67 28m-58-9 49 20" stroke="#7a4b2c" stroke-width="5" opacity=".32"/><g fill="'+colors[2]+'"><circle cx="371" cy="122" r="23"/><circle cx="393" cy="151" r="23"/><circle cx="359" cy="156" r="24"/><circle cx="380" cy="179" r="21"/></g><g fill="#e6cb8b"><ellipse cx="335" cy="231" rx="23" ry="14" transform="rotate(-20 335 231)"/><ellipse cx="367" cy="219" rx="20" ry="15" transform="rotate(-40 367 219)"/><ellipse cx="340" cy="206" rx="19" ry="13" transform="rotate(20 340 206)"/></g><g fill="#638047"><ellipse cx="295" cy="117" rx="12" ry="5" transform="rotate(-35 295 117)"/><ellipse cx="311" cy="110" rx="12" ry="5" transform="rotate(25 311 110)"/></g><path d="M118 66v91m-9-91v35q0 14 9 14t9-14V66m-9 91v121m407-210q-20 35-14 85h14V68v210" stroke="#737c68" stroke-width="5" fill="none" stroke-linecap="round"/><text x="320" y="338" text-anchor="middle" fill="#5b674f" font-family="sans-serif" font-size="12" letter-spacing="2">EMENTA DE EXEMPLO</text></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
function initialDemo(){const start=monday();const meals=[['Frango assado no forno','Com arroz e legumes salteados.',6.5],['Filetes de peixe','Com arroz de tomate e salada.',6.5],['Massa à bolonhesa','Molho de tomate e queijo ralado.',6],['Bacalhau com natas','Gratinado no forno, com salada.',7],['Arroz de legumes','Com grão, cenoura e ervas aromáticas.',6]];return {menu:{version:1,weekStart:start,title:'A ementa desta semana',intro:'Comida caseira, feita com tempo. Escolha os almoços dos seus dias e envie o seu pedido.',notice:'Consulte a cozinha sobre ingredientes e alergénios antes de pedir.',cutoffTime:'10:00',accepting:true,days:meals.map((m,i)=>({date:addDays(start,i),title:m[0],description:m[1],price:m[2],image:plate(i),available:true}))},orders:[]};}
function loadDemo(){try{const d=JSON.parse(sessionStorage.getItem(DEMO_KEY));if(d?.menu?.days?.length===5)return d;}catch{}return initialDemo();}
let demo=loadDemo(),menu,choices={},draft={},token='',view='public',adminPage='menu',requestId=uuid(),sending=false;
const customer={name:'',note:''};
let selectedRevision,toastTimer,uploading=0;
function busy(flag){$('#publicTab').disabled=flag;$('#adminTab').disabled=flag;$$('#orderForm input,#orderForm textarea').forEach(el=>el.disabled=flag);}
function persistDemo(){try{sessionStorage.setItem(DEMO_KEY,JSON.stringify(demo));}catch{throw new Error('O armazenamento desta demonstração está cheio. Experimente uma fotografia mais pequena.');}}
async function call(method,...args){if(LIVE)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'Não foi possível concluir. Tente novamente.')))[method](...args));return demoCall(method,...args);}
async function demoCall(method,...args){switch(method){case'getPublicMenu':return structuredClone(demo.menu);case'adminLogin':return 'demo';case'adminLogout':return true;case'getAdminData':return structuredClone(demo);case'publishMenu':{const next=structuredClone(args[1]);next.version=demo.menu.version+1;demo.menu=next;persistDemo();return structuredClone(next);}case'submitOrder':{const p=args[0];const old=demo.orders.find(o=>o.id===p.id);if(old)return {id:old.id,emailStatus:'demo'};if(p.version!==demo.menu.version)throw new Error('A ementa mudou. Atualize a página antes de enviar.');const o={id:p.id,createdAt:new Date().toISOString(),name:p.name,contact:p.contact,note:p.note,weekStart:menu.weekStart,items:p.items.map(x=>({...x,title:menu.days.find(d=>d.date===x.date).title,price:menu.days.find(d=>d.date===x.date).price})),emailStatus:'demo'};demo.orders.unshift(o);persistDemo();return {id:o.id,emailStatus:'demo'};}default:throw new Error('Operação indisponível.');}}
function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,5000);}

async function compressPhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('Escolha uma fotografia JPG, PNG ou WebP.');if(file.size>15*1024*1024)throw new Error('A fotografia deve ter menos de 15 MB.');const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Não foi possível ler a fotografia.'));i.src=url;});const canvas=document.createElement('canvas');let ratio=Math.min(1,800/Math.max(img.width,img.height));canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let quality=.8,data=canvas.toDataURL('image/jpeg',quality);while(data.length>180000&&quality>.3){quality-=.1;data=canvas.toDataURL('image/jpeg',quality);}if(data.length>180000)throw new Error('Esta imagem ainda é demasiado grande. Escolha outra fotografia.');return data;}finally{URL.revokeObjectURL(url);}}

function sha256Text(text) {
  const bytes = [];
  for (const ch of unescape(encodeURIComponent(String(text)))) bytes.push(ch.charCodeAt(0));
  const bitLength=bytes.length*8;
  bytes.push(128); while(bytes.length%64!==56)bytes.push(0);
  const high=Math.floor(bitLength/4294967296),low=bitLength>>>0;
  for(let s=24;s>=0;s-=8)bytes.push((high>>>s)&255);
  for(let s=24;s>=0;s-=8)bytes.push((low>>>s)&255);
  const h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const k=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let p=0;p<bytes.length;p+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++)w[i]=((bytes[p+i*4]<<24)|(bytes[p+i*4+1]<<16)|(bytes[p+i*4+2]<<8)|bytes[p+i*4+3])>>>0;
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))>>>0;}
    let [a,b,c,d,e,f,g,j]=h;
    for(let i=0;i<64;i++){const t1=(j+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+k[i]+w[i])>>>0;const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;j=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
    [a,b,c,d,e,f,g,j].forEach((v,i)=>h[i]=(h[i]+v)>>>0);
  }
  return h.map(v=>v.toString(16).padStart(8,'0')).join('');
}

function cleanText(value,max,required=false){
 if(typeof value!=='string')throw Error('Texto inválido.');
 const s=value.trim(); if(s.length>max||(required&&!s))throw Error('Verifique os campos obrigatórios e o tamanho do texto.');return s;
}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(Date.parse(s+'T12:00:00Z'))&&new Date(s+'T12:00:00Z').toISOString().slice(0,10)===s;}
function shiftDate(s,n){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function validateAllergens(item){

 $('#demoBanner').hidden=LIVE;$('#footerMode').textContent=LIVE?'Feito para simplificar a semana.':'Prévia · dados apenas neste dispositivo';
 if(!LIVE)$('#demoBanner').innerHTML='<strong>Demonstração</strong> · Dados apenas neste dispositivo. Nenhum pedido ou email é enviado.';
 try{menu=enrichMenu(await call('getPublicMenu'));renderPublic();}
 catch(e){$('#app').innerHTML='<div class="login panel"><h2>Já voltamos à mesa.</h2><p>'+esc(e.message)+'</p><button id="retry" type="button">Tentar novamente</button></div>';$('#retry').onclick=init;}
};
$('#adminTab').onclick=()=>showAdmin();
$('#publicTab').onclick=async()=>{try{const next=enrichMenu(await call('getPublicMenu'));if(!menu||next.version!==menu.version){choices={};requestId=uuid();}menu=next;renderPublic();}catch(e){notify(e.message);}};

init();
</script>
</body>
</html>
